<svg class="cat-loader__svg" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cute cat with headphones">
  <!-- Cat head -->
  <circle cx="120" cy="110" r="60" fill="currentColor" opacity="0.9"/>
  <!-- Ears -->
  <polygon points="80,70 100,40 110,75" fill="currentColor"/>
  <polygon points="130,75 140,40 160,70" fill="currentColor"/>
  <!-- Inner ears -->
  <polygon points="90,68 98,52 104,70" fill="var(--accent-soft)"/>
  <polygon points="136,70 142,52 150,68" fill="var(--accent-soft)"/>
  <!-- Eyes -->
  <circle cx="100" cy="105" r="8" fill="#fff"/>
  <circle cx="140" cy="105" r="8" fill="#fff"/>
  <circle cx="100" cy="105" r="4" fill="#1a0f33"/>
  <circle cx="140" cy="105" r="4" fill="#1a0f33"/>
  <!-- Nose -->
  <path d="M120 118 L116 125 H124 Z" fill="#f9a8d4"/>
  <!-- Mouth -->
  <path d="M120 125 Q120 132 114 132" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M120 125 Q120 132 126 132" stroke="#7c3aed" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="60" y1="120" x2="90" y2="118" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="130" x2="90" y2="124" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="118" x2="180" y2="120" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="150" y1="124" x2="178" y2="130" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <!-- Headphones -->
  <path d="M70 95 Q40 95 40 120 Q40 145 70 145" stroke="#a78bfa" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M170 95 Q200 95 200 120 Q200 145 170 145" stroke="#a78bfa" stroke-width="10" fill="none" stroke-linecap="round"/>
  <circle cx="40" cy="120" r="12" fill="#c4b5fd"/>
  <circle cx="200" cy="120" r="12" fill="#c4b5fd"/>
  <!-- Headband -->
  <rect x="70" y="88" width="100" height="12" rx="6" fill="#7c3aed"/>
  <!-- Cute blush -->
  <circle cx="92" cy="115" r="4" fill="#fda4af" opacity="0.7"/>
  <circle cx="148" cy="115" r="4" fill="#fda4af" opacity="0.7"/>
</svg>